name: Refresh projects

# Rediscovers projects from GitHub and Vercel, recaptures any stale screenshot,
# and commits the result. The commit triggers a Vercel rebuild, so the site
# picks up new projects with no manual step.
#
# Nothing here is required for the site to build — data/ is committed, so a
# failed run leaves the last good manifest serving.

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC nightly
  workflow_dispatch:
    inputs:
      force:
        description: 'Recapture every screenshot, ignoring freshness'
        type: boolean
        default: false
  repository_dispatch:
    types: [project-shipped] # other repos can poke this on deploy

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Discover projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Improves production-alias fidelity; discovery falls back
          # to repo homepage and the GitHub Deployments API without it.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm run discover

      - name: Capture screenshots
        run: node scripts/capture.mjs ${{ inputs.force && '--force' || '' }}

      - name: Verify the site still builds with the new data
        run: |
          npm run typecheck
          npm run build

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/shots
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          summary=$(node -e "
            const m=require('./data/manifest.json');
            const s=require('./data/screenshots.json');
            const shots=Object.values(s).filter(x=>x.status==='ok').length;
            console.log(\`\${m.projects.length} projects, \${shots} screenshots\`);
          ")
          git commit -m "chore(data): refresh discovery — $summary"
          git push
